# this file is here to facilitate development/testing
# $ docker compose up -d --build --force-recreate

services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

  backup:
    build:
      context: .
      args:
        POSTGRES_VERSION: '18'
    environment:
      SCHEDULE: '@weekly'     # optional
      BACKUP_KEEP_DAYS: 7     # optional; deletes expired timestamped backups ONLY
      BACKUP_FILENAME_MODE: "${BACKUP_FILENAME_MODE:-timestamp}"
      BACKUP_ALLOW_UNVERSIONED_OVERWRITE: "${BACKUP_ALLOW_UNVERSIONED_OVERWRITE-false}"
      PASSPHRASE: "${PASSPHRASE:?Set PASSPHRASE for encrypted backups}"
      S3_REGION:
      S3_ACCESS_KEY_ID:
      S3_SECRET_ACCESS_KEY:
      S3_SESSION_TOKEN:
      S3_BUCKET:
      S3_PREFIX: backup
      PGSSLMODE: disable
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

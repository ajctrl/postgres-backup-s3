name: build and push images

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with the race detector
        env:
          GOFLAGS: -race
          GORACE: atexit_sleep_ms=0
        run: go test -count=1 ./...

      - name: Vet Go packages
        run: go vet ./...

  integration:
    name: integration (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - postgres: 17
            test_image: postgres:17.12
          - postgres: 18
            test_image: postgres:18.7
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the integration image
        run: docker build --build-arg POSTGRES_VERSION=${{ matrix.postgres }} -t postgres-backup-s3:go-migration .

      - name: Verify PostgreSQL and S3 backup/restore round trips
        env:
          POSTGRES_TEST_IMAGE: ${{ matrix.test_image }}
        run: go test -count=1 -tags=integration -v -timeout=15m ./tests/integration

      - name: Require native PostgreSQL regression tests
        env:
          PG_MAJOR: ${{ matrix.postgres }}
          POSTGRES_TEST_IMAGE: ${{ matrix.test_image }}
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/pgs3-native.test" ./internal/backup
          chmod 755 "$RUNNER_TEMP/pgs3-native.test"
          docker run --rm --user postgres \
            -e PG_TEST_REQUIRED=true \
            -e PG_TEST_BINDIR="/usr/lib/postgresql/$PG_MAJOR/bin" \
            -v "$RUNNER_TEMP/pgs3-native.test:/tmp/pgs3-native.test:ro" \
            "$POSTGRES_TEST_IMAGE" \
            /tmp/pgs3-native.test -test.v -test.timeout=3m \
            -test.run 'Test(ArchiveSchema|RestorePlacement)WithPostgreSQL'

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [test, integration]
    concurrency:
      group: publish-${{ github.ref }}-${{ matrix.postgres }}
      queue: max
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        postgres: [17, 18]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare image tags
        id: images
        shell: bash
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ENABLED: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            printf 'ghcr.io/%s:%s-%s\n' "$repository" "$POSTGRES_VERSION" "$GITHUB_SHA"
            if [[ "$DOCKERHUB_ENABLED" == 'true' ]]; then
              printf 'docker.io/%s/%s:%s-%s\n' "${DOCKERHUB_USERNAME,,}" "${repository##*/}" "$POSTGRES_VERSION" "$GITHUB_SHA"
            fi
            echo 'EOF'
            printf 'dockerhub_enabled=%s\n' "$DOCKERHUB_ENABLED"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.images.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.images.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            POSTGRES_VERSION=${{ matrix.postgres }}
          platforms: |
            linux/amd64
            linux/arm64

      - name: Promote current master images
        if: github.event_name == 'push'
        env:
          IMAGE_TAGS: ${{ steps.images.outputs.tags }}
        run: |
          set -euo pipefail
          head=$(git ls-remote --exit-code origin refs/heads/master | cut -f1)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            while IFS= read -r tag; do
              docker buildx imagetools create --tag "${tag%-$GITHUB_SHA}" "$tag"
            done <<< "$IMAGE_TAGS"
          fi

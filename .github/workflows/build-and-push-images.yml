name: build and push images

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run tests with the race detector
        run: go test -count=1 -race ./...

      - name: Vet Go packages
        run: go vet ./...

  integration:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        postgres: [17, 18]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build the integration image
        run: docker build --build-arg POSTGRES_VERSION=${{ matrix.postgres }} -t postgres-backup-s3:go-migration .

      - name: Verify PostgreSQL and S3 backup/restore round trips
        env:
          POSTGRES_TEST_IMAGE: postgres:${{ matrix.postgres }}
        run: go test -count=1 -tags=integration -v -timeout=15m ./tests/integration

      - name: Require native PostgreSQL regression tests
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/pgs3-native.test" ./internal/backup
          chmod 755 "$RUNNER_TEMP/pgs3-native.test"
          docker run --rm --user postgres \
            -e PG_TEST_REQUIRED=true \
            -e PG_TEST_BINDIR="/usr/lib/postgresql/$PG_MAJOR/bin" \
            -v "$RUNNER_TEMP/pgs3-native.test:/tmp/pgs3-native.test:ro" \
            "postgres:$PG_MAJOR" \
            /tmp/pgs3-native.test -test.v -test.timeout=3m \
            -test.run 'Test(ArchiveSchema|RestorePlacement)WithPostgreSQL'

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [test, integration]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        postgres: [17, 18]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: images
        shell: bash
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ENABLED: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            printf 'ghcr.io/%s:%s\n' "$repository" "$POSTGRES_VERSION"
            if [[ "$DOCKERHUB_ENABLED" == 'true' ]]; then
              printf 'docker.io/%s/%s:%s\n' "${DOCKERHUB_USERNAME,,}" "${repository##*/}" "$POSTGRES_VERSION"
            fi
            echo 'EOF'
            printf 'dockerhub_enabled=%s\n' "$DOCKERHUB_ENABLED"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.images.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.images.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            POSTGRES_VERSION=${{ matrix.postgres }}
          platforms: |
            linux/amd64
            linux/arm64

name: build and push images

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run tests with the race detector
        run: go test -count=1 -race ./...

      - name: Vet Go packages
        run: go vet ./...

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build the integration image
        run: docker build -t postgres-backup-s3:go-migration .

      - name: Verify PostgreSQL and S3 backup/restore round trips
        run: go test -count=1 -tags=integration -v -timeout=15m ./tests/integration

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [test, integration]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - { postgres: 12, alpine: '3.12' }
          - { postgres: 13, alpine: '3.14' }
          - { postgres: 14, alpine: '3.16' }
          - { postgres: 15, alpine: '3.17' }
          - { postgres: 16, alpine: '3.19' }
          - { postgres: 17, alpine: '3.21' }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: images
        shell: bash
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ENABLED: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            printf 'ghcr.io/%s:%s\n' "$repository" "$POSTGRES_VERSION"
            if [[ "$DOCKERHUB_ENABLED" == 'true' ]]; then
              printf 'docker.io/%s/%s:%s\n' "${DOCKERHUB_USERNAME,,}" "${repository##*/}" "$POSTGRES_VERSION"
            fi
            echo 'EOF'
            printf 'dockerhub_enabled=%s\n' "$DOCKERHUB_ENABLED"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.images.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.images.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            ALPINE_VERSION=${{ matrix.alpine }}
          platforms: |
            linux/amd64
            linux/arm64

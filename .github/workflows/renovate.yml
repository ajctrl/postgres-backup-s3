name: Renovate

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  queue: max

jobs:
  update:
    if: github.event_name != 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        with:
          renovate-image: ghcr.io/renovatebot/renovate:44@sha256:65138147e008b4c48993052bf041dc907e4044b3912543a804e0ec91ae78b87d
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'

  refresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - name: Update outstanding Renovate branches and trigger PR checks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: bash .github/scripts/refresh-renovate-prs.sh
